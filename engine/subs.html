<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <title>subtitles pass</title>
  <link rel="stylesheet" href="/engine/overlay.css">
  <style>html, body, #stage { background: transparent !important; }</style>
  <script type="importmap">
    { "imports": { "three": "/node_modules/three/build/three.module.js", "three/addons/": "/node_modules/three/examples/jsm/" } }
  </script>
</head>
<body>
  <div id="stage"><div id="overlay"></div></div>
  <script type="module">
    // Subtitles alone on a transparent page; engine/render.mjs composites them over the 3D frames.
    import { Subtitles } from '/engine/lib/subtitles.js';
    const name = new URLSearchParams(location.search).get('video');
    const mod = await import(`/videos/${name}/scene.js`);
    const voice = await (await fetch(`/videos/${name}/voice.json`)).json();
    const subs = new Subtitles(document.getElementById('overlay'), voice, mod.subtitles ?? {});
    await document.fonts.ready;
    window.__subs = { renderAt: (t) => { subs.update(t); return subs.el.style.visibility === 'visible'; } };
    window.__ready = true;
  </script>
</body>
</html>
