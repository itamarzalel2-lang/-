<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <title>What-if player</title>
  <link rel="stylesheet" href="/engine/overlay.css">
  <script type="importmap">
    {
      "imports": {
        "three": "/node_modules/three/build/three.module.js",
        "three/addons/": "/node_modules/three/examples/jsm/"
      }
    }
  </script>
</head>
<body>
  <div id="stage">
    <canvas id="gl"></canvas>
    <div id="overlay"></div>
  </div>
  <div id="scrub" hidden>
    <button id="play">pause</button>
    <input id="time" type="range" min="0" step="0.01" value="0">
    <span id="clock">0.00 s</span>
  </div>
  <script type="module" src="/engine/player.js"></script>
</body>
</html>
